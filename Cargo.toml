[workspace]
resolver = "2"
members = ["crates/jtb-core", "crates/jtb-win", "crates/jtb-ui", "crates/jtb-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
windows = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
