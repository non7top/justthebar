name: Release

on:
  workflow_run:
    workflows: [release-please]
    types: [completed]
  # Backfill: rebuild and upload to an already-tagged release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)build and publish, e.g. v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  # Tags made with GITHUB_TOKEN do not trigger `push: tags`, so this runs after
  # release-please and checks whether that run tagged its own commit.
  check-release-tag:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find_tag.outputs.tag }}
      version: ${{ steps.find_tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find a release tag pointing at this commit
        id: find_tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            # No match is the normal case for a non-release merge; || true keeps -e from failing it.
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: check-release-tag
    if: needs.check-release-tag.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    # The called workflow declares a pull-requests job, which the caller has to allow even though a release never runs it.
    permissions:
      contents: read
      pull-requests: write
    with:
      ref: ${{ needs.check-release-tag.outputs.tag }}
      release-version: ${{ needs.check-release-tag.outputs.version }}

  release:
    needs: [check-release-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.check-release-tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-release-tag.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          name: jtb-app
          path: dist

      - name: Package like make deploy
        run: zip -j "jtb-$TAG-windows-x64.zip" dist/jtb-app.exe dist/jtb_hook.dll scripts/*.cmd scripts/jtb.json

      - name: Install NSIS
        run: |
          sudo find /etc/apt/sources.list.d -type f ! -name ubuntu.sources -delete
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nsis

      - name: Build the installer
        env:
          PROVENANCE_REPO: ${{ github.repository }}
        run: installer/build.sh "${TAG#v}" dist "dist/jtb-$TAG-windows-x64-setup.exe"

      - name: Collect the release files
        run: |
          mv "jtb-$TAG-windows-x64.zip" dist/
          cd dist
          sha256sum jtb-app.exe jtb_hook.dll "jtb-$TAG-windows-x64.zip" "jtb-$TAG-windows-x64-setup.exe" > SHA256SUMS

      # Attestation is by digest, so nothing may rewrite these files after this step.
      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: |
            dist/jtb-app.exe
            dist/jtb_hook.dll
            dist/jtb-*-windows-x64.zip
            dist/jtb-*-windows-x64-setup.exe
            dist/SHA256SUMS

      - uses: sigstore/cosign-installer@v4.1.3

      # Keyless: the job's OIDC token buys a short-lived Fulcio cert and the signature goes to Rekor, so no key is held.
      - name: Sign the release files (cosign, keyless)
        run: |
          for f in dist/jtb-app.exe dist/jtb_hook.dll dist/jtb-*-windows-x64.zip dist/jtb-*-windows-x64-setup.exe dist/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.cosign.bundle" "$f"
          done

      - name: Attach to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" --clobber dist/jtb-app.exe dist/jtb_hook.dll dist/jtb-*-windows-x64.zip dist/jtb-*-windows-x64-setup.exe dist/SHA256SUMS dist/*.cosign.bundle
