name: Release

on:
  workflow_run:
    workflows: [release-please]
    types: [completed]
  # Backfill: rebuild and upload to an already-tagged release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)build and publish, e.g. v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  # Tags made with GITHUB_TOKEN do not trigger `push: tags`, so this runs after
  # release-please and checks whether that run tagged its own commit.
  check-release-tag:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.find_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Find a release tag pointing at this commit
        id: find_tag
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            # No match is the normal case for a non-release merge; || true keeps -e from failing it.
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: check-release-tag
    if: needs.check-release-tag.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    # The called workflow declares a pull-requests job, which the caller has to allow even though a release never runs it.
    permissions:
      contents: read
      pull-requests: write
    with:
      ref: ${{ needs.check-release-tag.outputs.tag }}

  release:
    needs: [check-release-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.check-release-tag.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check-release-tag.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          name: jtb-app
          path: dist

      - name: Package like make deploy
        run: zip -j "jtb-$TAG-windows-x64.zip" dist/jtb-app.exe dist/jtb_hook.dll scripts/*.cmd scripts/jtb.json

      - name: Attach to the release
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" "jtb-$TAG-windows-x64.zip" --clobber
